# DCSServerBot API client configuration
services:
    # Guzzle HTTP client for DCSServerBot API
    dcsserverbot.http_client:
        class: GuzzleHttp\Client
        arguments:
            - base_uri: '%api_dcsserverbot_url%'
              timeout: 30
              http_errors: true
              headers:
                  User-Agent: 'VEAF-Website/1.0'

    # DCSServerBot API Configuration
    DcsServerBot\Configuration:
        factory: ['DcsServerBot\Configuration', 'getDefaultConfiguration']
        calls:
            - setHost: ['%api_dcsserverbot_url%']

    # API clients - injectable in services and controllers
    DcsServerBot\Api\InfoApi:
        arguments:
            - '@dcsserverbot.http_client'
            - '@DcsServerBot\Configuration'

    DcsServerBot\Api\StatisticsApi:
        arguments:
            - '@dcsserverbot.http_client'
            - '@DcsServerBot\Configuration'

    DcsServerBot\Api\CreditsApi:
        arguments:
            - '@dcsserverbot.http_client'
            - '@DcsServerBot\Configuration'
